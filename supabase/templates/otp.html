<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#fff8ec;font-family:Arial,Helvetica,sans-serif;color:#6a3346">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:2px solid #6a3346;border-radius:12px;padding:24px">
    <h1 style="font-size:20px;margin:0 0 12px;color:#d2475f">Your sign-in code</h1>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.5">Enter this code to sign in to Birthday Surprise. It expires in 15 minutes.</p>
    <p style="margin:0 0 16px;font-size:32px;letter-spacing:8px;font-weight:bold;color:#6a3346" data-otp>{{ .Token }}</p>
    <p style="margin:0;font-size:13px;color:#a26a7d">If you didn't request this, you can ignore this email. Nobody can sign in without this code.</p>
  </div>
</body>
</html>
